version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: career-platform-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=career_platform
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: career-platform-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongodb_data:
